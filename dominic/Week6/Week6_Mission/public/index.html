<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMCine · 회원가입과 평점 API</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142140;background:#f5f7fc}body{margin:0}header{background:#fff;border-bottom:1px solid #e1e7f2;padding:22px 7%;font-size:23px;font-weight:800}main{max-width:1200px;margin:32px auto;padding:0 24px}h1{font-size:30px;margin:0 0 8px}p{color:#66748e}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}article{background:white;border:1px solid #e0e6f2;border-radius:16px;padding:20px;box-shadow:0 5px 20px #2034690a}h2{font-size:18px;margin:0 0 6px}.desc{font-size:13px;margin:0 0 15px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ced7e7;border-radius:8px;font-size:14px}button{background:#345ee9;border:0;border-radius:8px;padding:10px 14px;color:white;font-weight:700;margin-top:14px;cursor:pointer}button.secondary{background:#e8edfb;color:#294ab5;margin-left:4px}pre{background:#f1f4fa;border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:80px;font-size:12px}small{color:#6c7790}</style></head><body><header>🎬 UMCine <small>회원가입 · 평점 API</small></header><main><h1>6주차 저장 API 확인</h1><p>회원가입과 평점 등록 결과를 서버에서 확인합니다.</p><section>
<article><h2>회원가입</h2><p class="desc">POST /members</p><form id="signup"><label>이메일</label><input name="email" value="demo-w6@example.com" required><label>닉네임</label><input name="nickname" value="week6demo" required><label>비밀번호</label><input name="password" type="password" value="Demo!1234" required><button>회원가입 요청</button><button type="button" class="secondary" id="invalid">검증 실패 확인</button></form><pre id="signup-result">요청 결과가 여기에 표시됩니다.</pre></article>
<article><h2>평점 등록</h2><p class="desc">POST /members/{memberId}/ratings</p><form id="rating"><label>회원 ID</label><input name="memberId" value="1" required><label>영화 ID</label><input name="movieId" type="number" value="800060" required><label>별점 (1~5)</label><input name="score" type="number" value="5" required><label>후기</label><input name="comment" value="재미있게 봤습니다"><button>평점 등록</button></form><pre id="rating-result">요청 결과가 여기에 표시됩니다.</pre></article>
<article><h2>동시 가입 중복 확인</h2><p class="desc">같은 이메일로 8개 요청을 동시에 보냅니다.</p><button id="race">동시 요청 실행</button><pre id="race-result">요청 결과가 여기에 표시됩니다.</pre><small>테스트용 이메일과 닉네임이 자동으로 생성됩니다.</small></article>
</section></main><script>
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return {status:r.status,body:await r.json()}}function show(id,r){document.querySelector(id).textContent=`HTTP ${r.status}\n${JSON.stringify(r.body,null,2)}`}function data(form){return Object.fromEntries(new FormData(form).entries())}
document.querySelector('#signup').onsubmit=async e=>{e.preventDefault();show('#signup-result',await api('/members',data(e.target)))};
document.querySelector('#invalid').onclick=async()=>show('#signup-result',await api('/members',{email:'invalid-email',nickname:'x',password:'weak'}));
document.querySelector('#rating').onsubmit=async e=>{e.preventDefault();const x=data(e.target);show('#rating-result',await api(`/members/${encodeURIComponent(x.memberId)}/ratings`,{movieId:Number(x.movieId),score:Number(x.score),comment:x.comment}))};
document.querySelector('#race').onclick=async e=>{e.currentTarget.disabled=true;const suffix=Date.now().toString();const responses=await Promise.all(Array.from({length:8},(_,i)=>api('/members',{email:`race${suffix}@example.com`,nickname:`R${i}${suffix.slice(-8)}`,password:'Demo!1234'})));document.querySelector('#race-result').textContent=JSON.stringify({요청:responses.length,성공:responses.filter(r=>r.status===201).length,중복:responses.filter(r=>r.status===409).length,오류코드:[...new Set(responses.filter(r=>r.status!==201).map(r=>r.body.code))]},null,2);e.currentTarget.disabled=false};
</script></body></html>
